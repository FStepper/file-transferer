[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "file-transferer"
version = "0.1.0"
description = "Fault-tolerant transfer of large folders via Google Drive (erasure coding)"
requires-python = ">=3.10"
dependencies = [
    "zfec>=1.6",
    "zstandard>=0.22",
    "tkinterdnd2>=0.4",   # drag & drop onto the window (optional at runtime)
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-timeout>=2.3", "pyinstaller>=6.10", "shellcheck-py"]

[project.scripts]
file-transferer = "file_transferer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["gui: opens a Tk window (on macOS CI each runs in its own process)"]
