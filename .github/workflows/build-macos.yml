name: build-macos

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [windows-latest, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      # On macOS this also runs the install script (dry run) with the system bash 3.2
      # -v names each test as it runs; a test stuck for 5 min fails with a stack dump of all threads
      - name: Tests
        if: runner.os != 'macOS'
        run: python -m pytest -v --timeout=300 --timeout-method=thread
      # Window tests run one process each on macOS (Tk limitation, see the script)
      - name: Tests (macOS)
        if: runner.os == 'macOS'
        run: bash packaging/run_tests_mac.sh python
      - name: Lint shell scripts
        if: runner.os == 'macOS'
        run: shellcheck --shell=bash -S warning "packaging/Install File Transferer.command" packaging/build_mac.sh packaging/run_tests_mac.sh

  build:
    needs: test
    # Build the app only when started manually or for a version tag
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14        # Apple Silicon (M1/M2/…)
            arch: arm64
          - runner: macos-15-intel  # Intel Macs (also runs on Apple Silicon via Rosetta)
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        env:
          SKIP_TESTS: "1"        # the test job above already ran them
        run: ./packaging/build_mac.sh
      - uses: actions/upload-artifact@v4
        with:
          name: file-transferer-macOS-${{ matrix.arch }}
          path: dist/file-transferer-macOS-${{ matrix.arch }}.zip

  build-windows:
    needs: test
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: powershell -ExecutionPolicy Bypass -File packaging/build_windows.ps1 -SkipTests
      - uses: actions/upload-artifact@v4
        with:
          name: file-transferer-windows-x64
          path: dist/file-transferer-windows-x64.zip

  # A pushed tag (v*) publishes all ZIPs as a GitHub Release with a stable download page
  release:
    needs: [build, build-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: file-transferer-*
          path: dist
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cat > notes.md <<'EOF'
          Builds of File Transferer (not signed or notarized).

          - **Mac, Apple Silicon (M1/M2/M3 …):** `file-transferer-macOS-arm64.zip`
          - **Mac, Intel:** `file-transferer-macOS-x86_64.zip`
          - **Windows (64-bit):** `file-transferer-windows-x64.zip`

          **Mac:** unzip, then double-click **Install File Transferer.command**. If
          macOS blocks it: right-click → Open (macOS 15+: System Settings ›
          Privacy & Security › Open Anyway). Details are in `README-INSTALL.txt`.

          **Windows:** unzip, run `file-transferer/file-transferer.exe`. If
          SmartScreen warns, choose More info → Run anyway.
          EOF
          ls -l dist
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.zip --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" dist/*.zip --title "File Transferer $TAG"               --notes-file notes.md --repo "$GITHUB_REPOSITORY"
          fi
