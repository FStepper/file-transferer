name: build-macos

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [windows-latest, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      # On macOS this also runs the install script (dry run) with the system bash 3.2
      # -v names each test as it runs; a test stuck for 5 min fails with a stack dump of all threads
      - name: Tests
        if: runner.os != 'macOS'
        run: python -m pytest -v --timeout=300 --timeout-method=thread
      # Tk on macOS only works reliably for the first Tk root of a process, so every
      # window test (marker "gui") runs in a process of its own there
      - name: Tests (macOS)
        if: runner.os == 'macOS'
        run: |
          python -m pytest -v --timeout=300 --timeout-method=thread -m "not gui"
          failed=0
          for t in $(python -m pytest --collect-only -q -m gui | grep '::'); do
            python -m pytest -v --timeout=120 --timeout-method=thread "$t" || failed=1
          done
          exit $failed
      - name: Lint shell scripts
        if: runner.os == 'macOS'
        run: shellcheck --shell=bash -S warning "packaging/Install File Transferer.command" packaging/build_mac.sh

  build:
    needs: test
    # Build the app only when started manually or for a version tag
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14        # Apple Silicon (M1/M2/…)
            arch: arm64
          - runner: macos-15-intel  # Intel Macs (also runs on Apple Silicon via Rosetta)
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: ./packaging/build_mac.sh
      - uses: actions/upload-artifact@v4
        with:
          name: file-transferer-macOS-${{ matrix.arch }}
          path: dist/file-transferer-macOS-${{ matrix.arch }}.zip
